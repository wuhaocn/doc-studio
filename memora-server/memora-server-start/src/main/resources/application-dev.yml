spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:memora_doc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed-data.sql

logging:
  level:
    com.memora: debug
    root: info

memora:
  auth:
    allow-demo-token: true
