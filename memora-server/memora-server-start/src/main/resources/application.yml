spring:
  application:
    name: memora-server
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${MEMORA_DB_FILE:./var/memora-runtime/memora_doc};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.memora.manager.entity

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.memora: info
    root: info

memora:
  bootstrap:
    local-admin:
      enabled: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_ENABLED:true}
      username: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_USERNAME:admin}
      password: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_PASSWORD:123456}
      display-name: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_DISPLAY_NAME:本地管理员}
      email: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_EMAIL:admin@memora.local}
      tenant-name: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_TENANT_NAME:Memora 默认工作区}
      tenant-slug: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_TENANT_SLUG:memora-local}
      industry: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_INDUSTRY:本地联调}
      plan-name: ${MEMORA_BOOTSTRAP_LOCAL_ADMIN_PLAN_NAME:TEAM}
  auth:
    session-cookie:
      name: ${MEMORA_AUTH_SESSION_COOKIE_NAME:MEMORA_SESSION}
      path: /
      same-site: ${MEMORA_AUTH_SESSION_COOKIE_SAME_SITE:Lax}
      secure: ${MEMORA_AUTH_SESSION_COOKIE_SECURE:false}
      max-age-seconds: ${MEMORA_AUTH_SESSION_COOKIE_MAX_AGE_SECONDS:2592000}
  audit:
    retention-days: 3650
    archive-batch-size: 200
    export-max-size: 1000
    retention-scheduler:
      enabled: true
      cron: ${MEMORA_AUDIT_RETENTION_CRON:0 15 2 * * *}
      zone: ${MEMORA_AUDIT_RETENTION_ZONE:Asia/Shanghai}
  share:
    default-expire-days: 7
  api-key:
    default-expire-days: 90
    secret-encryption-key: ${MEMORA_API_KEY_SECRET_ENCRYPTION_KEY:memora-local-api-key-secret}
  web:
    allowed-origins: ${MEMORA_WEB_ALLOWED_ORIGINS:http://localhost:8800,http://127.0.0.1:8800}
