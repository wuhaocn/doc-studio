spring:
  application:
    name: memora-server
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${MEMORA_DB_FILE:./var/memora-runtime/memora_doc};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.memora.manager.entity

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.memora: info
    root: info

memora:
  auth:
    allow-demo-token: false
  audit:
    retention-days: 3650
    archive-batch-size: 200
    export-max-size: 1000
  share:
    default-expire-days: 7
  api-key:
    default-expire-days: 90
