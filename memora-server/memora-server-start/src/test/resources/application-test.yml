spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:memora_doc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed-data.sql

memora:
  api-key:
    secret-encryption-key: memora-test-api-key-secret
  audit:
    retention-scheduler:
      enabled: false
